# mini_web_server 설정. "키 값" 한 줄씩, #으로 시작하는 줄은 주석
# 실행: ./build/server -c conf/server.conf [-p 포트] [-r 루트] [-t 스레드수]  (인자가 파일 값을 덮어씀)

port 8080
root ./www
threads 8
client_timeout_ms 5000
request_deadline_ms 10000
backend_connect_timeout_ms 1000
backend_timeout_ms 3000

# route <prefix> static | proxy <IPv4:포트>...   (가장 긴 prefix가 이김, 경로 조각 단위로 비교)
route /api/ proxy 127.0.0.1:8001 127.0.0.1:8002
route / static
