# 수강신청 시나리오: 백엔드 3대 + 메인 · 보조
# 실행: ./build/backend 8001 & ./build/backend 8002 & ./build/backend 8003 &
#       ./build/server -c conf/course.conf &      (메인)
#       ./build/server -c conf/course.conf &      (보조: 잠금 파일을 못 얻어 기다림)

port 8080
root ./www
threads 32

# 잠금 파일을 쥔 쪽이 메인. 컨테이너 디스크에 둔다 (/work는 Windows 마운트라 잠금이 다르게 동작할 수 있음)
lock_file /tmp/mini_web_server.lock
standby_timeout_ms 1000
standby_fails 3

# 줄 서기: 신청은 대기 토큰 순서로 들인다. 동시에 12명, 오라고 한 시각보다 3초 늦으면 떠난 것으로 본다
# 처리 중인 요청과 내부 대기 슬롯의 요청은 워커를 하나씩 쓴다. threads는 gate_slots + gate_chairs보다 커야 한다
gate_path /api/apply
gate_slots 12
gate_chairs 12
gate_grace_ms 3000
# 한 과목이 끝나도 순번을 유지한다 (0이면 다음 과목은 토큰 재발급). 고른 이유: docs/report-5000.md 4장
gate_keep 1

# 고르기: 덜 바쁜 쪽으로, 연속 3번 실패하면 10초 빼고, 돌아오면 5초에 걸쳐 늘린다. 조회는 다시 보낸다
balance least
eject_fails 3
eject_ms 10000
slow_start_ms 5000
retry_safe 1

route /api/ proxy 127.0.0.1:8001 127.0.0.1:8002 127.0.0.1:8003
route / static
